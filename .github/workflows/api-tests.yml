name: API tests

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['api/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and security tests
        run: python -m unittest discover -s api/tests -v
      - name: Build the container image
        run: docker build -t learnalgorithms-api api
