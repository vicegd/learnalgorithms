name: ❓ Ask about the content
description: Something in a lesson is not clear to you.
title: "[Question] "
labels: ["question"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The page your question is about.
      placeholder: https://learnalgorithms.dev/concepts/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Question
      description: What is not clear? Quote the sentence, formula or step if you can.
    validations:
      required: true
