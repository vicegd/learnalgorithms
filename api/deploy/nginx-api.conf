# Alternative to Caddy when nginx already serves other sites on this server.
# Copy to /etc/nginx/sites-available/api.learnalgorithms.dev, enable it, and run
#   certbot --nginx -d api.learnalgorithms.dev
server {
    listen 80;
    server_name api.learnalgorithms.dev;

    client_max_body_size 1m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # overwrites any client value
        proxy_read_timeout 60s;
    }
}
