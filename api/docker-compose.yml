# Production stack for api.learnalgorithms.dev.
#
#   docker compose --profile caddy up -d   # when ports 80/443 are free (Caddy does HTTPS)
#   docker compose up -d                   # when another web server already proxies to 127.0.0.1:8083
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8083}:8080"  # only reachable from the server itself
    volumes:
      - api-data:/data
    read_only: true                  # immutable container file system
    tmpfs:
      - /tmp
    cap_drop: [ALL]                  # no Linux capabilities
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on: [api]

volumes:
  api-data:
  caddy-data:
  caddy-config:
