  <text class="t-s" x="514.0" y="180.0" text-anchor="middle" dominant-baseline="central">parent of position i:</text>
  <text class="t-s t-m t-b" x="514.0" y="200.0" text-anchor="middle" dominant-baseline="central">(i − 1) / 2</text>
