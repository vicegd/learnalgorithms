<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 640 230" width="640" height="230" role="img">
  <title>Subtraction scheme: with a = 1 the calls form a chain; with a = 2 they double at every level</title>
  <text class="t-s t-b" x="90.0" y="16.0" text-anchor="middle" dominant-baseline="central">a = 1: a chain of n/b calls</text>
  <rect class="box-blue" x="55.0" y="32.0" width="70.0" height="26.0" rx="6"/>
  <text class="t-s t-m" x="90.0" y="45.5" text-anchor="middle" dominant-baseline="central">n</text>
  <rect class="box-blue" x="55.0" y="72.0" width="70.0" height="26.0" rx="6"/>
  <text class="t-s t-m" x="90.0" y="85.5" text-anchor="middle" dominant-baseline="central">n − b</text>
  <line class="ln" x1="90.0" y1="58.0" x2="90.0" y2="72.0"/>
  <rect class="box-blue" x="55.0" y="112.0" width="70.0" height="26.0" rx="6"/>
  <text class="t-s t-m" x="90.0" y="125.5" text-anchor="middle" dominant-baseline="central">n − 2b</text>
  <line class="ln" x1="90.0" y1="98.0" x2="90.0" y2="112.0"/>
  <text class="t-mut" x="90.0" y="165.0" text-anchor="middle" dominant-baseline="central">⋮</text>
  <rect class="box-blue" x="55.0" y="192.0" width="70.0" height="26.0" rx="6"/>
  <text class="t-s t-m" x="90.0" y="205.5" text-anchor="middle" dominant-baseline="central">base</text>
  <line class="ln" x1="90.0" y1="58.0" x2="90.0" y2="72.0"/>
  <line class="ln" x1="90.0" y1="138.0" x2="90.0" y2="150.0"/>
  <line class="ln" x1="90.0" y1="168.0" x2="90.0" y2="192.0"/>
  <text class="t-s t-b" x="420.0" y="16.0" text-anchor="middle" dominant-baseline="central">a = 2: the number of calls doubles at each level</text>
  <line class="ln" x1="420.0" y1="55.0" x2="330.0" y2="80.0"/>
  <line class="ln" x1="420.0" y1="55.0" x2="510.0" y2="80.0"/>
  <line class="ln" x1="330.0" y1="100.0" x2="285.0" y2="125.0"/>
  <line class="ln" x1="330.0" y1="100.0" x2="375.0" y2="125.0"/>
  <line class="ln" x1="510.0" y1="100.0" x2="465.0" y2="125.0"/>
  <line class="ln" x1="510.0" y1="100.0" x2="555.0" y2="125.0"/>
  <line class="ln" x1="285.0" y1="145.0" x2="262.5" y2="170.0"/>
  <line class="ln" x1="285.0" y1="145.0" x2="307.5" y2="170.0"/>
  <line class="ln" x1="375.0" y1="145.0" x2="352.5" y2="170.0"/>
  <line class="ln" x1="375.0" y1="145.0" x2="397.5" y2="170.0"/>
  <line class="ln" x1="465.0" y1="145.0" x2="442.5" y2="170.0"/>
  <line class="ln" x1="465.0" y1="145.0" x2="487.5" y2="170.0"/>
  <line class="ln" x1="555.0" y1="145.0" x2="532.5" y2="170.0"/>
  <line class="ln" x1="555.0" y1="145.0" x2="577.5" y2="170.0"/>
  <circle class="box-ac" cx="420.0" cy="45.0" r="10.0"/>
  <circle class="box-ac" cx="330.0" cy="90.0" r="10.0"/>
  <circle class="box-ac" cx="510.0" cy="90.0" r="10.0"/>
  <circle class="box-ac" cx="285.0" cy="135.0" r="10.0"/>
  <circle class="box-ac" cx="375.0" cy="135.0" r="10.0"/>
  <circle class="box-ac" cx="465.0" cy="135.0" r="10.0"/>
  <circle class="box-ac" cx="555.0" cy="135.0" r="10.0"/>
  <circle class="box-ac" cx="262.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="307.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="352.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="397.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="442.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="487.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="532.5" cy="180.0" r="10.0"/>
  <circle class="box-ac" cx="577.5" cy="180.0" r="10.0"/>
  <text class="t-xs t-ac" x="615.0" y="45.0" text-anchor="end" dominant-baseline="central">1</text>
  <text class="t-xs t-ac" x="615.0" y="90.0" text-anchor="end" dominant-baseline="central">2</text>
  <text class="t-xs t-ac" x="615.0" y="135.0" text-anchor="end" dominant-baseline="central">4</text>
  <text class="t-xs t-ac" x="615.0" y="180.0" text-anchor="end" dominant-baseline="central">8</text>
  <text class="t-xs t-ac" x="420.0" y="222.0" text-anchor="middle" dominant-baseline="central">after n/b levels: 2^(n/b) calls, exponential</text>
</svg>
