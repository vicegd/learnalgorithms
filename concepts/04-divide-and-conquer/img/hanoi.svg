<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 720 200" width="720" height="200" role="img">
  <title>Towers of Hanoi with three discs: the three steps of the recursive strategy</title>
  <text class="t-xs t-b" x="94.0" y="18.0" text-anchor="middle" dominant-baseline="central">start</text>
  <rect class="box-soft" x="14.0" y="150.0" width="160.0" height="6.0" rx="2"/>
