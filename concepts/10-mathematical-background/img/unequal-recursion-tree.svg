<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 860 260" width="860" height="260" role="img">
  <title>Recursion tree of T(n) = T(n/3) + T(2n/3) + n: every complete level costs n</title>
  <line class="ln-hl" x1="300.0" y1="38.0" x2="170.0" y2="80.0"/>
  <line class="ln-ac" x1="300.0" y1="38.0" x2="430.0" y2="80.0"/>
  <line class="ln-hl" x1="170.0" y1="104.0" x2="100.0" y2="146.0"/>
  <line class="ln" x1="170.0" y1="104.0" x2="230.0" y2="146.0"/>
  <line class="ln" x1="430.0" y1="104.0" x2="370.0" y2="146.0"/>
  <line class="ln-ac" x1="430.0" y1="104.0" x2="500.0" y2="146.0"/>
  <rect class="box-blue" x="271.0" y="14.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="300.0" y="26.5" text-anchor="middle" dominant-baseline="central">n</text>
  <rect class="box-blue" x="141.0" y="80.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="170.0" y="92.5" text-anchor="middle" dominant-baseline="central">n/3</text>
  <rect class="box-blue" x="401.0" y="80.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="430.0" y="92.5" text-anchor="middle" dominant-baseline="central">2n/3</text>
  <rect class="box-blue" x="71.0" y="146.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="100.0" y="158.5" text-anchor="middle" dominant-baseline="central">n/9</text>
  <rect class="box-blue" x="201.0" y="146.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="230.0" y="158.5" text-anchor="middle" dominant-baseline="central">2n/9</text>
  <rect class="box-blue" x="341.0" y="146.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="370.0" y="158.5" text-anchor="middle" dominant-baseline="central">2n/9</text>
  <rect class="box-blue" x="471.0" y="146.0" width="58.0" height="24.0" rx="6"/>
  <text class="t-s t-m" x="500.0" y="158.5" text-anchor="middle" dominant-baseline="central">4n/9</text>
  <text class="t-mut" x="300.0" y="200.0" text-anchor="middle" dominant-baseline="central">⋮</text>
  <text class="t-xs t-m" x="570.0" y="26.0" text-anchor="start" dominant-baseline="central">n</text>
  <text class="t-xs t-m" x="570.0" y="92.0" text-anchor="start" dominant-baseline="central">n/3 + 2n/3 = n</text>
  <text class="t-xs t-m" x="570.0" y="158.0" text-anchor="start" dominant-baseline="central">n/9 + 2n/9 + 2n/9 + 4n/9 = n</text>
  <text class="t-xs t-hl" x="40.0" y="225.0" text-anchor="start" dominant-baseline="central">shortest branch (always n/3): log₃ n levels</text>
  <text class="t-xs t-ac" x="40.0" y="243.0" text-anchor="start" dominant-baseline="central">longest branch (always 2n/3): log₃/₂ n levels</text>
  <text class="t-s t-b" x="820.0" y="234.0" text-anchor="end" dominant-baseline="central">total: Θ(n log n)</text>
</svg>
