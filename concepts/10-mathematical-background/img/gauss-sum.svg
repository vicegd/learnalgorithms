<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 520 230" width="520" height="230" role="img">
  <title>Two copies of the staircase 1 + 2 + ... + n fit together into a rectangle of n by n + 1 squares</title>
  <rect class="box-blue" x="40.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="70.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="100.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="130.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="160.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="190.0" y="30.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="40.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="70.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="100.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="130.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="160.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="190.0" y="60.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="40.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="70.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="100.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="130.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="160.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="190.0" y="90.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="40.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="70.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="100.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="130.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="160.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="190.0" y="120.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="40.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="70.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="100.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="130.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-blue" x="160.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <rect class="box-ac" x="190.0" y="150.0" width="30.0" height="30.0" rx="0"/>
  <text class="t-xs t-blue" x="30.0" y="45.0" text-anchor="end" dominant-baseline="central">1</text>
  <text class="t-xs t-ac" x="230.0" y="45.0" text-anchor="start" dominant-baseline="central">5</text>
  <text class="t-xs t-blue" x="30.0" y="75.0" text-anchor="end" dominant-baseline="central">2</text>
  <text class="t-xs t-ac" x="230.0" y="75.0" text-anchor="start" dominant-baseline="central">4</text>
  <text class="t-xs t-blue" x="30.0" y="105.0" text-anchor="end" dominant-baseline="central">3</text>
  <text class="t-xs t-ac" x="230.0" y="105.0" text-anchor="start" dominant-baseline="central">3</text>
  <text class="t-xs t-blue" x="30.0" y="135.0" text-anchor="end" dominant-baseline="central">4</text>
  <text class="t-xs t-ac" x="230.0" y="135.0" text-anchor="start" dominant-baseline="central">2</text>
  <text class="t-xs t-blue" x="30.0" y="165.0" text-anchor="end" dominant-baseline="central">5</text>
  <text class="t-xs t-ac" x="230.0" y="165.0" text-anchor="start" dominant-baseline="central">1</text>
  <text class="t-xs t-mut" x="130.0" y="200.0" text-anchor="middle" dominant-baseline="central">n + 1 = 6 columns</text>
  <text class="t-s t-blue" x="290.0" y="50.0" text-anchor="start" dominant-baseline="central">blue: S = 1 + 2 + 3 + 4 + 5</text>
  <text class="t-s t-ac" x="290.0" y="74.0" text-anchor="start" dominant-baseline="central">orange: S again, upside down</text>
  <text class="t-s" x="290.0" y="110.0" text-anchor="start" dominant-baseline="central">together: 5 rows × 6 columns</text>
  <text class="t-s t-b" x="290.0" y="134.0" text-anchor="start" dominant-baseline="central">2S = n(n + 1) = 30</text>
  <text class="t-s t-b t-hl" x="290.0" y="158.0" text-anchor="start" dominant-baseline="central">S = n(n + 1)/2 = 15</text>
</svg>
