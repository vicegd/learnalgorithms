  <rect class="box-hl" x="460.0" y="110.0" width="105.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="512.5" y="124.0" text-anchor="middle" dominant-baseline="central">7</text>
  <text class="t-xs t-mut" x="565.0" y="148.0" text-anchor="middle" dominant-baseline="central">27</text>
  <rect class="box-hl" x="565.0" y="110.0" width="120.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="625.0" y="124.0" text-anchor="middle" dominant-baseline="central">8</text>
  <text class="t-xs t-mut" x="685.0" y="148.0" text-anchor="middle" dominant-baseline="central">35</text>
  <text class="t-s t-b t-hl" x="703.0" y="124.0" text-anchor="start" dominant-baseline="central">Σ waits = 112</text>
  <text class="t-xs t-mut" x="422.5" y="190.0" text-anchor="middle" dominant-baseline="central">small numbers: the moment each customer is served; their sum is the total waiting time</text>
</svg>
