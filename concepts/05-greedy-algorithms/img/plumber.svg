  <rect class="box-blue" x="265.0" y="30.0" width="75.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="302.5" y="44.0" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="t-xs t-mut" x="340.0" y="68.0" text-anchor="middle" dominant-baseline="central">12</text>
  <rect class="box-blue" x="340.0" y="30.0" width="60.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="370.0" y="44.0" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="t-xs t-mut" x="400.0" y="68.0" text-anchor="middle" dominant-baseline="central">16</text>
  <rect class="box-blue" x="400.0" y="30.0" width="45.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="422.5" y="44.0" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="t-xs t-mut" x="445.0" y="68.0" text-anchor="middle" dominant-baseline="central">19</text>
  <rect class="box-blue" x="445.0" y="30.0" width="90.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="490.0" y="44.0" text-anchor="middle" dominant-baseline="central">6</text>
  <text class="t-xs t-mut" x="535.0" y="68.0" text-anchor="middle" dominant-baseline="central">25</text>
  <rect class="box-blue" x="535.0" y="30.0" width="120.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="595.0" y="44.0" text-anchor="middle" dominant-baseline="central">8</text>
