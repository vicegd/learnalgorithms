<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 700 200" width="700" height="200" role="img">
  <title>The plumber: the same total time, but doing the shortest tasks first reduces the total waiting time from 147 to 112</title>
  <text class="t-s" x="150.0" y="44.0" text-anchor="end" dominant-baseline="central">given order</text>
  <rect class="box-blue" x="160.0" y="30.0" width="105.0" height="28.0" rx="2"/>
