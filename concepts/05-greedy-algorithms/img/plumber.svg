  <text class="t-xs t-b" x="670.0" y="44.0" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="t-xs t-mut" x="685.0" y="68.0" text-anchor="middle" dominant-baseline="central">35</text>
  <text class="t-s t-b" x="703.0" y="44.0" text-anchor="start" dominant-baseline="central">Σ waits = 147</text>
  <text class="t-s" x="150.0" y="124.0" text-anchor="end" dominant-baseline="central">shortest first</text>
  <rect class="box-hl" x="160.0" y="110.0" width="30.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="175.0" y="124.0" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="t-xs t-mut" x="190.0" y="148.0" text-anchor="middle" dominant-baseline="central">2</text>
