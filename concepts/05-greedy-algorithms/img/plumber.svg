  <rect class="box-hl" x="235.0" y="110.0" width="60.0" height="28.0" rx="2"/>
  <text class="t-xs t-b" x="265.0" y="124.0" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="t-xs t-mut" x="295.0" y="148.0" text-anchor="middle" dominant-baseline="central">9</text>
  <rect class="box-hl" x="295.0" y="110.0" width="75.0" height="28.0" rx="2"/>
