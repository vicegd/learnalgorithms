  <line class="ln" x1="410.0" y1="102.0" x2="344.0" y2="142.0"/>
  <line class="ln" x1="410.0" y1="102.0" x2="476.0" y2="142.0"/>
  <rect class="box-blue" x="224.2" y="14.0" width="107.6" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="278.0" y="26.5" text-anchor="middle" dominant-baseline="central">[0, 10) → 647</text>
  <rect class="box-blue" x="95.8" y="78.0" width="100.4" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="146.0" y="90.5" text-anchor="middle" dominant-baseline="central">[0, 5) → 324</text>
  <rect class="box-hl" x="37.0" y="142.0" width="86.0" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="80.0" y="154.5" text-anchor="middle" dominant-baseline="central">76 13 → 89</text>
  <rect class="box-hl" x="154.6" y="142.0" width="114.8" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="212.0" y="154.5" text-anchor="middle" dominant-baseline="central">97 90 48 → 235</text>
  <rect class="box-blue" x="356.2" y="78.0" width="107.6" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="410.0" y="90.5" text-anchor="middle" dominant-baseline="central">[5, 10) → 323</text>
  <rect class="box-hl" x="297.4" y="142.0" width="93.2" height="24.0" rx="6"/>
  <text class="t-xs t-m" x="344.0" y="154.5" text-anchor="middle" dominant-baseline="central">76 94 → 170</text>
  <rect class="box-hl" x="418.6" y="142.0" width="114.8" height="24.0" rx="6"/>
