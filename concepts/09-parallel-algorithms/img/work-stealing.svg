<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 640 220" width="640" height="220" role="img">
  <title>Work stealing: an idle worker takes a task from the other end of the queue of a busy worker</title>
  <rect class="box-soft" x="20.0" y="20.0" width="180.0" height="150.0" rx="8"/>
  <text class="t-s t-b" x="110.0" y="38.0" text-anchor="middle" dominant-baseline="central">worker 1</text>
  <rect class="box-ac" x="35.0" y="53.0" width="150.0" height="26.0" rx="6"/>
  <text class="t-xs" x="110.0" y="66.5" text-anchor="middle" dominant-baseline="central">running: T4</text>
  <text class="t-xs t-mut" x="110.0" y="92.0" text-anchor="middle" dominant-baseline="central">its own queue (deque)</text>
  <rect class="box-blue" x="38.0" y="102.0" width="34.0" height="28.0" rx="3"/>
  <text class="t-xs" x="55.0" y="116.5" text-anchor="middle" dominant-baseline="central">T5</text>
  <rect class="box-blue" x="74.0" y="102.0" width="34.0" height="28.0" rx="3"/>
  <text class="t-xs" x="91.0" y="116.5" text-anchor="middle" dominant-baseline="central">T6</text>
  <rect class="box-blue" x="110.0" y="102.0" width="34.0" height="28.0" rx="3"/>
  <text class="t-xs" x="127.0" y="116.5" text-anchor="middle" dominant-baseline="central">T7</text>
  <rect class="box-blue" x="146.0" y="102.0" width="34.0" height="28.0" rx="3"/>
  <text class="t-xs" x="163.0" y="116.5" text-anchor="middle" dominant-baseline="central">T8</text>
  <rect class="box-soft" x="230.0" y="20.0" width="180.0" height="150.0" rx="8"/>
  <text class="t-s t-b" x="320.0" y="38.0" text-anchor="middle" dominant-baseline="central">worker 2</text>
  <rect class="box-mut" x="245.0" y="53.0" width="150.0" height="26.0" rx="6"/>
  <text class="t-xs" x="320.0" y="66.5" text-anchor="middle" dominant-baseline="central">running: nothing</text>
  <text class="t-xs t-mut" x="320.0" y="92.0" text-anchor="middle" dominant-baseline="central">its own queue (deque)</text>
  <rect class="box-mut" x="248.0" y="102.0" width="144.0" height="28.0" rx="4"/>
  <text class="t-xs t-mut" x="320.0" y="116.0" text-anchor="middle" dominant-baseline="central">empty</text>
  <rect class="box-soft" x="440.0" y="20.0" width="180.0" height="150.0" rx="8"/>
  <text class="t-s t-b" x="530.0" y="38.0" text-anchor="middle" dominant-baseline="central">worker 3</text>
  <rect class="box-ac" x="455.0" y="53.0" width="150.0" height="26.0" rx="6"/>
  <text class="t-xs" x="530.0" y="66.5" text-anchor="middle" dominant-baseline="central">running: T9</text>
  <text class="t-xs t-mut" x="530.0" y="92.0" text-anchor="middle" dominant-baseline="central">its own queue (deque)</text>
  <rect class="box-blue" x="458.0" y="102.0" width="34.0" height="28.0" rx="3"/>
  <text class="t-xs" x="475.0" y="116.5" text-anchor="middle" dominant-baseline="central">T10</text>
  <path class="ln-hl" d="M55.0,132.0 Q187.5,172.0 313.3,134.0"/>
  <polygon class="ah-hl" points="320.0,132.0 314.3,137.4 312.3,130.7"/>
  <text class="t-xs t-hl" x="200.0" y="196.0" text-anchor="middle" dominant-baseline="central">worker 2 steals T5, the oldest (largest) task of worker 1</text>
</svg>
