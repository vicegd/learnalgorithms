<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 520 290" width="520" height="290" role="img">
  <title>The triangular loop: for each i, j goes from i + 1 to n; the iterations fill half of an n by n square</title>
  <text class="t-xs t-mut" x="56.0" y="66.0" text-anchor="end" dominant-baseline="central">i=1</text>
  <rect class="box-mut" x="70.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="102.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="134.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="166.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="198.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="230.0" y="50.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-hl" x="274.0" y="66.0" text-anchor="start" dominant-baseline="central">5 iterations</text>
  <text class="t-xs t-mut" x="56.0" y="98.0" text-anchor="end" dominant-baseline="central">i=2</text>
  <rect class="box-mut" x="70.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="102.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="134.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="166.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="198.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="230.0" y="82.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-hl" x="274.0" y="98.0" text-anchor="start" dominant-baseline="central">4 iterations</text>
  <text class="t-xs t-mut" x="56.0" y="130.0" text-anchor="end" dominant-baseline="central">i=3</text>
  <rect class="box-mut" x="70.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="102.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="134.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="166.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="198.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="230.0" y="114.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-hl" x="274.0" y="130.0" text-anchor="start" dominant-baseline="central">3 iterations</text>
  <text class="t-xs t-mut" x="56.0" y="162.0" text-anchor="end" dominant-baseline="central">i=4</text>
  <rect class="box-mut" x="70.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="102.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="134.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="166.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="198.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="230.0" y="146.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-hl" x="274.0" y="162.0" text-anchor="start" dominant-baseline="central">2 iterations</text>
  <text class="t-xs t-mut" x="56.0" y="194.0" text-anchor="end" dominant-baseline="central">i=5</text>
  <rect class="box-mut" x="70.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="102.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="134.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="166.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="198.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-hl" x="230.0" y="178.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-hl" x="274.0" y="194.0" text-anchor="start" dominant-baseline="central">1 iteration</text>
  <text class="t-xs t-mut" x="56.0" y="226.0" text-anchor="end" dominant-baseline="central">i=6</text>
  <rect class="box-mut" x="70.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="102.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="134.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="166.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="198.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <rect class="box-mut" x="230.0" y="210.0" width="32.0" height="32.0" rx="0"/>
  <text class="t-xs t-mut" x="274.0" y="226.0" text-anchor="start" dominant-baseline="central">0 iterations</text>
  <text class="t-xs t-mut" x="86.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=1</text>
  <text class="t-xs t-mut" x="118.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=2</text>
  <text class="t-xs t-mut" x="150.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=3</text>
  <text class="t-xs t-mut" x="182.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=4</text>
  <text class="t-xs t-mut" x="214.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=5</text>
  <text class="t-xs t-mut" x="246.0" y="40.0" text-anchor="middle" dominant-baseline="central">j=6</text>
  <text class="t-s t-b" x="166.0" y="264.0" text-anchor="middle" dominant-baseline="central">n = 6: 5 + 4 + 3 + 2 + 1 + 0 = 15 = n(n − 1)/2</text>
  <text class="t-xs t-mut" x="166.0" y="284.0" text-anchor="middle" dominant-baseline="central">about half of the n² cells: still O(n²)</text>
</svg>
