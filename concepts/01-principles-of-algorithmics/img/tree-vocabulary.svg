<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 640 260" width="640" height="260" role="img">
  <title>Tree vocabulary: root, parent, children, leaves, depth and height</title>
  <line class="ln-hl" x1="200.0" y1="35.0" x2="110.0" y2="105.0"/>
  <line class="ln" x1="200.0" y1="35.0" x2="290.0" y2="105.0"/>
  <line class="ln" x1="110.0" y1="105.0" x2="60.0" y2="175.0"/>
  <line class="ln-hl" x1="110.0" y1="105.0" x2="160.0" y2="175.0"/>
  <line class="ln" x1="290.0" y1="105.0" x2="290.0" y2="175.0"/>
  <line class="ln-hl" x1="160.0" y1="175.0" x2="160.0" y2="240.0"/>
  <circle class="box-ac" cx="200.0" cy="35.0" r="16.0"/>
  <text class="t-m" x="200.0" y="35.0" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="box" cx="110.0" cy="105.0" r="16.0"/>
  <text class="t-m" x="110.0" y="105.0" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="box" cx="290.0" cy="105.0" r="16.0"/>
  <text class="t-m" x="290.0" y="105.0" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="box-hl" cx="60.0" cy="175.0" r="16.0"/>
  <text class="t-m" x="60.0" y="175.0" text-anchor="middle" dominant-baseline="central">4</text>
  <circle class="box" cx="160.0" cy="175.0" r="16.0"/>
  <text class="t-m" x="160.0" y="175.0" text-anchor="middle" dominant-baseline="central">5</text>
  <circle class="box-hl" cx="290.0" cy="175.0" r="16.0"/>
  <text class="t-m" x="290.0" y="175.0" text-anchor="middle" dominant-baseline="central">6</text>
  <circle class="box-hl" cx="160.0" cy="240.0" r="16.0"/>
  <text class="t-m" x="160.0" y="240.0" text-anchor="middle" dominant-baseline="central">7</text>
  <text class="t-xs t-ac" x="228.0" y="35.0" text-anchor="start" dominant-baseline="central">root</text>
  <text class="t-xs t-mut" x="136.0" y="100.0" text-anchor="start" dominant-baseline="central">parent of 4 and 5</text>
  <text class="t-xs t-hl" x="82.0" y="177.0" text-anchor="start" dominant-baseline="central">leaf</text>
  <text class="t-xs t-hl" x="312.0" y="177.0" text-anchor="start" dominant-baseline="central">leaf</text>
  <text class="t-xs t-hl" x="182.0" y="242.0" text-anchor="start" dominant-baseline="central">leaf</text>
  <text class="t-xs t-mut" x="400.0" y="35.0" text-anchor="start" dominant-baseline="central">depth 0</text>
  <line class="ln-mut" x1="350.0" y1="35.0" x2="392.0" y2="35.0"/>
  <text class="t-xs t-mut" x="400.0" y="105.0" text-anchor="start" dominant-baseline="central">depth 1</text>
  <line class="ln-mut" x1="350.0" y1="105.0" x2="392.0" y2="105.0"/>
  <text class="t-xs t-mut" x="400.0" y="175.0" text-anchor="start" dominant-baseline="central">depth 2</text>
  <line class="ln-mut" x1="350.0" y1="175.0" x2="392.0" y2="175.0"/>
  <text class="t-xs t-mut" x="400.0" y="240.0" text-anchor="start" dominant-baseline="central">depth 3</text>
  <line class="ln-mut" x1="350.0" y1="240.0" x2="392.0" y2="240.0"/>
  <text class="t-s t-b" x="520.0" y="120.0" text-anchor="middle" dominant-baseline="central">height = 3</text>
  <text class="t-xs t-mut" x="520.0" y="140.0" text-anchor="middle" dominant-baseline="central">(the deepest node)</text>
  <text class="t-xs t-hl" x="520.0" y="175.0" text-anchor="middle" dominant-baseline="central">one path from the root</text>
  <text class="t-xs t-hl" x="520.0" y="190.0" text-anchor="middle" dominant-baseline="central">to each node: 1 → 2 → 5 → 7</text>
</svg>
