openapi: 3.1.0
info:
  title: learnalgorithms.dev API
  version: 1.1.0
  description: >
    Privacy-preserving REST API for learnalgorithms.dev. Implemented using only the
    Python standard library with SQLite persistence. Stores no personal data or IP addresses.
servers:
  - url: https://api.learnalgorithms.dev
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Random 256-bit admin token (`ADMIN_TOKEN`), compared in constant time.
    GitHubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 signature (`sha256=<hex>`) computed with `GITHUB_WEBHOOK_SECRET`.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FeedbackRequest:
      type: object
      required: [page, helpful, elapsed]
      properties:
        page:
          type: string
          pattern: '^/concepts(/[a-z0-9][a-z0-9-]{0,80}){1,3}/?$'
          example: /concepts/sorting/quicksort
        helpful:
          type: boolean
        comment:
          type: [string, 'null']
          maxLength: 500
        elapsed:
          type: integer
          minimum: 0
          description: Time spent on page in milliseconds (submissions < 3000 ms are silently discarded).
        website:
          type: string
          description: Honeypot field; must remain empty.
        client:
          type: [string, 'null']
          format: uuid
          description: Optional random UUID generated in browser localStorage to distinguish students behind a shared campus IP.
    TelemetryEvent:
      type: object
      required: [sessionId, eventType, page]
      properties:
        sessionId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - page_view
            - page_leave
            - lesson_complete
            - lesson_uncomplete
            - cheat_sheet_filter
            - cheat_sheet_compare
            - visualizer_interact
            - search
        page:
          type: string
          example: /concepts/sorting/quicksort
        durationMs:
          type: [integer, 'null']
          minimum: 0
          maximum: 3600000
        scrollPct:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        meta:
          type: [object, 'null']
          additionalProperties:
            type: [string, number, boolean, 'null']
          description: Optional sanitized key-value metadata (max 512 bytes serialized).

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /feedback:
    post:
      summary: Submit anonymous lesson feedback
      description: Requires `Origin: https://learnalgorithms.dev`. Limited to one vote per page, client, and day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback stored
        '200':
          description: Already voted for this page today
        '202':
          description: Silently discarded (bot check)
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin not allowed
        '429':
          description: Rate limit exceeded

  /feedback/summary:
    get:
      summary: Aggregated helpfulness votes for one page
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: string
            example: /concepts/sorting/quicksort
      responses:
        '200':
          description: Vote counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: string
                  helpful:
                    type: integer
                  notHelpful:
                    type: integer
        '400':
          description: Invalid page parameter
        '429':
          description: Rate limit exceeded

  /popular:
    get:
      summary: Most read lessons of the last 7 days
      description: Fetched from Matomo over HTTPS and cached for 15 minutes; degrades gracefully to an empty list on error.
      responses:
        '200':
          description: Top pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page:
                          type: string
                        visits:
                          type: integer

  /events:
    post:
      summary: Record anonymous student/usage telemetry events
      description: Accepts a single event object or a batch (`events`, max 20 items, max 4 KB body). Requires `Origin: https://learnalgorithms.dev`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TelemetryEvent'
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        $ref: '#/components/schemas/TelemetryEvent'
      responses:
        '201':
          description: Events stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: stored
                  count:
                    type: integer
        '400':
          description: Validation error
        '403':
          description: Origin not allowed
        '429':
          description: Rate limit exceeded

  /webhooks/github:
    post:
      summary: Receive GitHub issue webhooks
      security:
        - GitHubSignature: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Ping acknowledged
        '202':
          description: Non-issue event ignored
        '204':
          description: Issue event stored
        '400':
          description: Invalid payload
        '401':
          description: Invalid HMAC signature

  /admin/feedback:
    get:
      summary: Latest feedback votes and comments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Latest feedback entries
        '401':
          description: Unauthorized

  /admin/stats:
    get:
      summary: Aggregated learning analytics summary
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Aggregated totals, top pages (views, avg duration, avg scroll), lesson completions, and daily series
        '400':
          description: Invalid days parameter
        '401':
          description: Unauthorized

  /admin/events:
    get:
      summary: Export anonymized telemetry events (JSON or CSV)
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Anonymized events in JSON or downloadable CSV (`learnalgorithms-events.csv`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelemetryEvent'
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid query parameter
        '401':
          description: Unauthorized
